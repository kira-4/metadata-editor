version: '3.8'

services:
  metadata-editor:
    build: .
    container_name: metadata-editor
    restart: unless-stopped
    # Write files as the host user that owns /music (see PUID/PGID in .env)
    user: "${PUID:-1000}:${PGID:-1000}"

    environment:
      - INCOMING_ROOT=/incoming
      - NAVIDROME_ROOT=/music
      - DATA_DIR=/data
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - OPENROUTER_FALLBACK_MODELS=${OPENROUTER_FALLBACK_MODELS:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-}
      - APP_NAME=محرر الأصوات الولائية
      - SCAN_INTERVAL_SECONDS=30
      - TRASH_RETENTION_DAYS=${TRASH_RETENTION_DAYS:-30}
      - TZ=America/Los_Angeles
      - PORT=8090

    volumes:
      # Mount Pinchflat download directory (read/write)
      - ./incoming:/incoming

      # Mount Navidrome music library (read/write)
      - ./music:/music

      # Persistent service data (database, artwork cache)
      - ./data:/data

    ports:
      - "8090:8090"

    healthcheck:
      # No curl in python:slim; urlopen raises (exit 1) on errors and 503
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/api/health', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
